name: Build & Release JARVIS APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Test Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
      - name: Prepare Secrets and Keystore
        run: |
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
          else
            echo "GEMINI_API_KEY=AIzaSyPlaceholderKey" > .env
          fi
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Rename APK for Easy Identification
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/JARVIS-debug.apk
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-debug-apk
          path: release-output/JARVIS-debug.apk
          retention-days: 30
      - name: Create GitHub Release with APK
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.0.0
          name: "JARVIS AI v1.0.0"
          body: |
            ## ⚡ JARVIS AI Assistant - Latest Build (Daily Driver Foundation)
            Automatic build triggered from commit `${{ github.sha }}`.
            
            ### 📥 Download:
            Download the `JARVIS-debug.apk` asset below and install directly on your Android device!
          files: release-output/JARVIS-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
